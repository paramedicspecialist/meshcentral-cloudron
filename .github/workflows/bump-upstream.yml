name: Bump MeshCentral

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and republish the current package version
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect upstream release
        id: upstream
        env:
          FORCE_BUMP: ${{ github.event.inputs.force == 'true' && 'true' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bump-upstream.sh

      - name: Log in to GHCR
        if: steps.upstream.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push package image
        if: steps.upstream.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Update CloudronVersions.json
        if: steps.upstream.outputs.changed == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.version }}
        run: node scripts/update-versions.mjs

      - name: Commit catalog
        if: steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile CloudronManifest.json CHANGELOG CloudronVersions.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "Publish MeshCentral ${VERSION}."
          git push
